<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C17F4B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="나의 일기">
  <title>나의 일기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── PIN 잠금 화면 ── -->
  <div id="pinOverlay" class="pin-overlay">
    <div class="pin-inner">
      <div class="pin-icon">📓</div>
      <h2 class="pin-app-name">나의 일기</h2>
      <p class="pin-label" id="pinLabel">비밀번호를 입력해주세요</p>
      <div class="pin-dots" id="pinDots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>
      <p class="pin-error" id="pinError"></p>
      <div class="numpad">
        <button class="np-btn" data-n="1">1</button>
        <button class="np-btn" data-n="2">2</button>
        <button class="np-btn" data-n="3">3</button>
        <button class="np-btn" data-n="4">4</button>
        <button class="np-btn" data-n="5">5</button>
        <button class="np-btn" data-n="6">6</button>
        <button class="np-btn" data-n="7">7</button>
        <button class="np-btn" data-n="8">8</button>
        <button class="np-btn" data-n="9">9</button>
        <div class="np-empty"></div>
        <button class="np-btn" data-n="0">0</button>
        <button class="np-btn np-del" id="pinDel">⌫</button>
      </div>
      <button class="pin-cancel-btn" id="pinCancelBtn" style="display:none">취소</button>
    </div>
  </div>

  <!-- ── Header ── -->
  <header class="app-header" id="appHeader">
    <button class="btn-icon" id="btnBack" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="header-title" id="headerTitle">나의 일기</h1>
    <button class="btn-icon" id="btnMore" aria-label="더보기">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
  </header>

  <!-- ── Views ── -->
  <main class="main-content">

    <!-- 달력 뷰 -->
    <div id="viewCalendar" class="view active">
      <div class="cal-nav">
        <button class="btn-icon" id="btnPrevMonth" aria-label="이전 달">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="btn-icon" id="btnNextMonth" aria-label="다음 달">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="cal-weekdays">
        <span class="sun">일</span><span>월</span><span>화</span>
        <span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div class="recent-section">
        <h3 class="section-title">최근 일기</h3>
        <div class="entry-list" id="recentList"></div>
      </div>

      <div class="settings-row">
        <button class="btn-change-pin" id="btnChangePinOpen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          비밀번호 변경
        </button>
      </div>
    </div>

    <!-- 목록 뷰 -->
    <div id="viewList" class="view">
      <div class="search-wrap">
        <div class="search-box" id="searchBox">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="일기 검색...">
          <button class="btn-clear" id="btnClearSearch" aria-label="검색 지우기">✕</button>
        </div>
      </div>
      <div class="entry-list" id="allList"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📓</div>
        <p>아직 작성한 일기가 없어요</p>
        <span>오늘의 이야기를 기록해보세요</span>
      </div>
    </div>

    <!-- 에디터 뷰 -->
    <div id="viewEditor" class="view">
      <div class="editor-date-label" id="editorDateLabel"></div>

      <div class="card mood-card">
        <p class="card-label">오늘의 기분</p>
        <div class="mood-grid" id="moodGrid">
          <button class="mood-btn" data-mood="😊" title="행복">😊</button>
          <button class="mood-btn" data-mood="🥰" title="설렘">🥰</button>
          <button class="mood-btn" data-mood="🤩" title="신남">🤩</button>
          <button class="mood-btn" data-mood="😌" title="평온">😌</button>
          <button class="mood-btn" data-mood="😐" title="보통">😐</button>
          <button class="mood-btn" data-mood="😔" title="슬픔">😔</button>
          <button class="mood-btn" data-mood="😢" title="눈물">😢</button>
          <button class="mood-btn" data-mood="😤" title="화남">😤</button>
          <button class="mood-btn" data-mood="😰" title="불안">😰</button>
          <button class="mood-btn" data-mood="😴" title="피곤">😴</button>
        </div>
      </div>

      <input type="text" id="editorTitle" class="editor-title" placeholder="제목 (선택)">
      <textarea id="editorContent" class="editor-body" placeholder="오늘 하루는 어땠나요?"></textarea>

      <div class="card photo-card">
        <div class="photo-list" id="editorPhotoList"></div>
        <label class="btn-add-photo" for="photoInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          사진 추가
        </label>
        <input type="file" id="photoInput" accept="image/*" multiple capture="environment">
      </div>

      <div class="card tags-card">
        <p class="card-label">태그</p>
        <div class="tags-row" id="editorTagsRow">
          <input type="text" id="tagInput" class="tag-input" placeholder="태그 입력 후 Enter">
        </div>
      </div>

      <button class="btn-save" id="btnSave">저장하기</button>
    </div>

    <!-- 상세 뷰 -->
    <div id="viewDetail" class="view">
      <div class="detail-hero">
        <span class="detail-hero-mood" id="detailMood"></span>
        <div>
          <h2 class="detail-hero-title" id="detailTitle"></h2>
          <span class="detail-hero-date" id="detailDate"></span>
        </div>
      </div>
      <div class="detail-body" id="detailBody"></div>
      <div class="detail-photos" id="detailPhotos"></div>
      <div class="detail-tags" id="detailTags"></div>
    </div>

  </main>

  <!-- ── Bottom Nav ── -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-view="calendar" id="navCalendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>달력</span>
    </button>

    <button class="nav-btn nav-write" id="navWrite" aria-label="일기 쓰기">
      <div class="write-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
    </button>

    <button class="nav-btn" data-view="list" id="navList">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/>
      </svg>
      <span>목록</span>
    </button>
  </nav>

  <!-- ── 사진 모달 ── -->
  <div class="modal" id="photoModal">
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal-body">
      <img id="modalImg" src="" alt="사진">
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    </div>
  </div>

  <!-- ── 더보기 메뉴 ── -->
  <div class="ctx-overlay" id="ctxOverlay"></div>
  <div class="ctx-menu" id="ctxMenu">
    <button class="ctx-btn" id="btnEdit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      수정하기
    </button>
    <button class="ctx-btn danger" id="btnDelete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      삭제하기
    </button>
  </div>

  <!-- ── 삭제 확인 모달 ── -->
  <div class="modal" id="confirmModal">
    <div class="modal-bg" id="confirmBg"></div>
    <div class="confirm-box">
      <p class="confirm-title">일기를 삭제할까요?</p>
      <p class="confirm-sub">삭제한 일기는 복구할 수 없어요.</p>
      <div class="confirm-btns">
        <button class="confirm-cancel" id="confirmCancel">취소</button>
        <button class="confirm-ok" id="confirmOk">삭제</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
